---
version: "0.1"
runson: mac

autosplit: true
retryOnFailure: true
maxRetries: 1
concurrency: 2

testDiscovery:
  type: raw
  mode: remote
  command: grep -nri -E 'it ".*." do' spec/*.rb | awk '{print$1}' | sed 's/\(.*\):/\1 /'
testRunnerCommand: bundle exec rspec "$test" --format html --out rspec_results.html

pre:
  # HyperExecute has no Ruby runtime for macOS, so use the system Ruby (2.6)
  # with the bundler version pinned in Gemfile.lock, installed per-user
  - bash -c 'gem install --user-install --no-document bundler -v 2.2.32'
  - bash -c 'bundle config set --local deployment true && bundle install'

cacheKey: '{{ checksum "Gemfile.lock" }}'
cacheDirectories:
  - /vendor

report: true
partialReports:
 location: rspec_results.html
 type: html

env:
   CONFIG_NAME: "mac"

jobLabel: [selenium-Rspec, mac, autosplit-simple]
