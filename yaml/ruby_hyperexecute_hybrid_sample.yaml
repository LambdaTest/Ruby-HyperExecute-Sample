version: "0.1"
globalTimeout: 90
testSuiteTimeout: 90
testSuiteStep: 90

runson: ${matrix.os}
retryOnFailure: true
autosplit: true
maxRetries: 1
parallelism: 1
concurrency: 3

matrix:
  os: [mac, win, linux]

cacheKey: '{{ checksum "Gemfile.lock" }}'
cacheDirectories:
  - /vendor

pre:
  # One pre for every OS: mac has no Ruby runtime support and only the system
  # Ruby 2.6, so install the bundler version pinned in Gemfile.lock per-user.
  # Plain commands only (no shell syntax) so they run the same on mac, win and linux.
  - gem install --user-install --no-document bundler -v 2.2.32
  - bundle config set --local deployment true
  - bundle install

testDiscovery:
  type: raw
  mode: remote
  command: grep -nri -E 'it ".*." do' spec/*.rb | awk '{print$1}' | sed 's/\(.*\):/\1 /'

mergeArtifacts: true
uploadArtefacts:
 - name: report
   path:
     - rspec_results.html

report: true
partialReports:
 location: rspec_results.html
 type: html

testRunnerCommand: bundle exec rspec "$test" --format html --out rspec_results.html

jobLabel: [selenium-Rspec, hybrid]
